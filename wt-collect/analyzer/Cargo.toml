[package]
name = "wt-analyze"
version.workspace = true
edition.workspace = true

[dependencies]
wtc-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imagesize = "0.13"
flate2 = "1"
